name: Build Caffeine (Apple Silicon)

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build arm64 Release
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          uname -m

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project src/Caffeine.xcodeproj \
            -scheme Caffeine

      - name: Build (Release, arm64, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project src/Caffeine.xcodeproj \
            -scheme Caffeine \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            build | xcpretty || exit 1

      - name: Verify binary architecture
        run: |
          APP="build/Build/Products/Release/Caffeine.app"
          lipo -info "$APP/Contents/MacOS/Caffeine"
          codesign --verify --deep --strict "$APP"

      - name: Package zip
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent Caffeine.app Caffeine-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Caffeine-arm64
          path: build/Build/Products/Release/Caffeine-arm64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            build/Build/Products/Release/Caffeine-arm64.zip
